# Reusable CI for Python repos managed with uv.
#
# Expects in the calling repo: pyproject.toml and uv.lock, tests under
# tests/, and ruff as a dev dependency (or installed via uvx).
name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test on
        type: string
        default: '3.12'

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    name: pytest (Python ${{ inputs.python-version }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest
